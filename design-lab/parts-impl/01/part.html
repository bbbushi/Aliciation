<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>01 会话头栏 · B 舱壁 · 部件演示</title>
<style>
/* ============ 方向 B 共享 token（组装页由基准 :root 统一定义，此处仅为独立运行复制） ============ */
:root{
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --bg:#0d1114; --srf:#11171d; --line:#263443;
  --tx:#ccd6dd; --dim:#7d8b96; --faint:#57646e;
  --acc:#8fb8cc; --acc-dim:#42606f; --ok:#7fa07f; --bad:#c9705c;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--acc-dim);outline-offset:2px}

/* ============ 演示装置（lab-*：mock 环境，不属部件 01，组装时整体丢弃） ============ */
/* 首载入场：罕见档，一容器一入场（.lab 是唯一入场容器，头栏随容器在场，不二次入场） */
.lab{height:100dvh;display:flex;flex-direction:column;
  transition:opacity 220ms var(--ease-out),transform 220ms var(--ease-out)}
@starting-style{.lab{opacity:0;transform:translateY(6px)}}
/* 视口挤压：布局瞬变，不挂任何过渡（PRINCIPLES §1 #13） */
.lab[data-w="mid"]{width:560px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.lab[data-w="narrow"]{width:360px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.lab-demo{background:var(--srf);border-bottom:1px solid var(--line);padding:8px 18px 7px}
.lab-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:5px}
.lab-row:first-child{margin-top:0}
.lab-cap{font:10px/1 var(--mono);letter-spacing:.16em;color:var(--faint);margin-right:8px}
.lab-gcap{font:10px/1 var(--mono);letter-spacing:.06em;color:var(--faint);margin-right:2px}
.lab-dbtn{font:11.5px/1 var(--sans);letter-spacing:.02em;color:var(--dim);background:none;
  border:1px solid var(--line);border-radius:2px;padding:6px 11px;
  transition:color 140ms ease,background-color 140ms ease,border-color 140ms ease,transform 160ms var(--ease-out)}
.lab-dbtn:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){.lab-dbtn:hover{color:#b9c6cf}}
.lab-dbtn[aria-current]{color:var(--acc);border-color:var(--acc-dim);background:#16232c}
.lab-sep{width:1px;height:14px;background:var(--line);margin:0 5px}
.lab-note{margin:7px 0 0;font:10.5px/1.5 var(--sans);color:var(--faint);letter-spacing:.02em}

/* ============ 01 会话头栏（p01-*）——部件本体，与 FRAGMENT.md 逐字一致 ============ */
.p01-head{display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:11px 18px;border-bottom:1px solid var(--line);overflow:hidden}
.p01-id{display:flex;align-items:center;gap:11px;min-width:0}
.p01-badge{width:27px;height:27px;flex:none;display:grid;place-items:center;
  background:#16232c;border:1px solid var(--acc-dim);color:var(--acc);font:12px/1 var(--mono);
  clip-path:polygon(0 0,calc(100% - 9px) 0,100% 9px,100% 100%,0 100%)}
.p01-t{display:flex;flex-direction:column;gap:3px;min-width:0}
.p01-name{font-size:14.5px;font-weight:600;color:#e2e9ee;letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p01-sub{font:10.5px/1 var(--mono);color:var(--faint);letter-spacing:.12em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p01-linkwrap{flex:none;margin:0;display:flex}
.p01-link{display:none;font:11px/1 var(--sans);letter-spacing:.03em;color:var(--dim);
  border:1px solid var(--line);border-radius:2px;padding:6px 10px;white-space:nowrap;
  clip-path:polygon(0 0,calc(100% - 7px) 0,100% 7px,100% 100%,0 100%)}
.p01-link::before{content:'●';font-size:7px;margin-right:7px;vertical-align:1px}
/* 状态行可见性白名单：仅 up/closing 两合法值各显一条；缺失/非法 → 整行隐藏，不出占位符 */
.p01-head[data-p01-link="up"] .p01-link[data-p01-on="up"],
.p01-head[data-p01-link="closing"] .p01-link[data-p01-on="closing"]{display:block}
.p01-link[data-p01-on="up"]::before{color:var(--ok)}
.p01-link[data-p01-on="closing"]{color:var(--bad);border-color:#5a3831}
.p01-link[data-p01-on="closing"]::before{color:var(--bad)}
/* 部件零动画：无任何 transition/animation；reduced-motion 无需独立规则 */

/* ============ mock 列表区（lab-*，不属部件） ============ */
.lab-body{flex:1;display:grid;place-content:center;gap:10px;text-align:center;padding:20px}
.lab-mock{margin:0;font:11px/1.7 var(--mono);color:var(--dim);letter-spacing:.05em}
.lab-readout{margin:0;font:10px/1.7 var(--mono);color:var(--faint);letter-spacing:.04em}

/* ============ reduced-motion：删入场位移，保留淡入；反馈态颜色/按压照旧（底线，非动效） ============ */
@media (prefers-reduced-motion:reduce){
  .lab{transition:opacity 160ms var(--ease-out);transform:none}
}
</style>
</head>
<body>
<div class="lab" data-w="wide">

  <section class="lab-demo" aria-label="演示装置（mock 总线注入，不属部件 01）">
    <div class="lab-row">
      <span class="lab-cap">mock 注入</span>
      <span class="lab-gcap">linkState</span>
      <button class="lab-dbtn" data-g="link" data-v="up">up</button>
      <button class="lab-dbtn" data-g="link" data-v="closing">closing</button>
      <button class="lab-dbtn" data-g="link" data-v="undef">缺失字段</button>
      <button class="lab-dbtn" data-g="link" data-v="bad">非法值</button>
      <span class="lab-sep" aria-hidden="true"></span>
      <button class="lab-dbtn" id="labJit">抖动 up↔closing ×9</button>
    </div>
    <div class="lab-row">
      <span class="lab-gcap">sessionTitle</span>
      <button class="lab-dbtn" data-g="title" data-v="normal">Alice（缺省）</button>
      <button class="lab-dbtn" data-g="title" data-v="c2000">2000 字注入</button>
      <button class="lab-dbtn" data-g="title" data-v="url">不可断 URL</button>
      <button class="lab-dbtn" data-g="title" data-v="empty">空串</button>
      <button class="lab-dbtn" data-g="title" data-v="one">单字</button>
    </div>
    <div class="lab-row">
      <span class="lab-gcap">listState（01 不消费）</span>
      <button class="lab-dbtn" data-g="list" data-v="ready">ready</button>
      <button class="lab-dbtn" data-g="list" data-v="loading">loading</button>
      <button class="lab-dbtn" data-g="list" data-v="empty">empty</button>
      <span class="lab-sep" aria-hidden="true"></span>
      <span class="lab-gcap">视口</span>
      <button class="lab-dbtn" data-g="w" data-v="wide">宽</button>
      <button class="lab-dbtn" data-g="w" data-v="mid">中 560</button>
      <button class="lab-dbtn" data-g="w" data-v="narrow">窄 360</button>
    </div>
    <p class="lab-note">部件级离线演示，数据全部虚构。五态覆盖：常规=up+ready；空=empty；加载=loading；错误=closing 与缺失/非法值（状态行应整行消失、不留占位与原始值字样）；最坏=2000 字/URL/空串/单字 + 窄视口 + 抖动。<br>头栏按规格不随 listState 变化；系统开启「减弱动态效果」时，首载入场折叠为淡入。</p>
  </section>

  <!-- ↓↓↓ 部件本体（组装契约原文，见 FRAGMENT.md） ↓↓↓ -->
  <header class="p01-head" data-p01-link="up" data-p01-abnormal="false" aria-label="会话头栏">
    <div class="p01-id">
      <span class="p01-badge" aria-hidden="true">A</span>
      <div class="p01-t">
        <span class="p01-name">Alice</span>
        <span class="p01-sub">单一会话 · 记忆持续</span>
      </div>
    </div>
    <p class="p01-linkwrap" role="status">
      <span class="p01-link" data-p01-on="up">本机已连接</span>
      <span class="p01-link" data-p01-on="closing">服务正在关闭</span>
    </p>
  </header>
  <!-- ↑↑↑ 部件本体结束 ↑↑↑ -->

  <div class="lab-body" aria-hidden="true">
    <p class="lab-mock" id="labMock"></p>
    <p class="lab-readout" id="labReadout"></p>
  </div>

</div>
<script>
'use strict';
/* ===== 01 部件渲染（与 FRAGMENT.md JS 块逐字一致） ===== */
function p01Render(state){
  const head=document.querySelector('.p01-head');
  if(!head)return;
  const nameEl=head.querySelector('.p01-name');
  const title=(typeof state.sessionTitle==='string')?state.sessionTitle:'Alice';
  nameEl.textContent=title;
  /* 信息可达：全文经平台标准悬浮提示属性；仅在实际发生截断时挂载 */
  if(nameEl.scrollWidth>nameEl.clientWidth+1)nameEl.setAttribute('title',title);
  else nameEl.removeAttribute('title');
  /* linkState 规范化：非法/缺失 → unknown（CSS 白名单使状态行整体隐藏，不出 "undefined"） */
  const link=(state.linkState==='up'||state.linkState==='closing')?state.linkState:'unknown';
  head.dataset.p01Link=link;
  head.dataset.p01Abnormal=(link==='closing')?'true':'false';
}

/* ===== 演示装置接线（lab-*，组装时丢弃） ===== */
const TITLE_BLOCK='编译在凌晨完成，没有警告。起服日志滚过三百行，端口监听正常。';
const TITLE_2000=(()=>{let s='';while(s.length<2000)s+=TITLE_BLOCK;return s.slice(0,2000);})();
const TITLES={normal:'Alice',c2000:TITLE_2000,
  url:'https://mirror.internal.alice/pkg/'+'a'.repeat(258),empty:'',one:'澈'};
const LINKS={up:'up',closing:'closing',undef:undefined,bad:'reconnecting'};
const MOCKTXT={
  ready:'02 消息列表 · mock：listState=ready —— 头栏不消费该字段',
  loading:'正在载入对话…（02 的加载态；规格：头栏不参与）',
  empty:'（空态文案属 06；头栏照常在场）'
};
const S={titleKey:'normal',linkKey:'up',linkState:'up',listKey:'ready',wKey:'wide'};
const frame=document.querySelector('.lab'),
  mock=document.getElementById('labMock'),
  readout=document.getElementById('labReadout'),
  jitBtn=document.getElementById('labJit'),
  head=document.querySelector('.p01-head');
function markGroup(g,v){
  document.querySelectorAll('.lab-dbtn[data-g="'+g+'"]').forEach(b=>{
    v===b.dataset.v?b.setAttribute('aria-current','true'):b.removeAttribute('aria-current');});
}
function renderReadout(){
  readout.textContent='可编程标记：data-p01-link="'+head.dataset.p01Link
    +'" · data-p01-abnormal="'+head.dataset.p01Abnormal+'"（供读屏与测试断言）';
}
function renderAll(){
  frame.dataset.w=S.wKey;
  markGroup('link',S.linkKey);markGroup('title',S.titleKey);
  markGroup('list',S.listKey);markGroup('w',S.wKey);
  p01Render({sessionTitle:TITLES[S.titleKey],linkState:S.linkState});
  mock.textContent=MOCKTXT[S.listKey];
  renderReadout();
}
document.querySelectorAll('.lab-dbtn[data-g]').forEach(b=>b.addEventListener('click',()=>{
  const g=b.dataset.g,v=b.dataset.v;
  if(g==='link'){stopJit();S.linkKey=v;S.linkState=LINKS[v];}
  else if(g==='title')S.titleKey=v;
  else if(g==='list')S.listKey=v;
  else if(g==='w')S.wKey=v;
  renderAll();
}));
/* 链路抖动剧本：90ms 间隔连发 9 次，最后一次（closing）为准；重触发先取消旧剧本，不叠加 */
let jitT=null;
function stopJit(){if(jitT){clearInterval(jitT);jitT=null;}jitBtn.removeAttribute('aria-current');}
jitBtn.addEventListener('click',()=>{
  stopJit();jitBtn.setAttribute('aria-current','true');
  let i=0;
  jitT=setInterval(()=>{
    const v=(i%2===0)?'closing':'up';
    S.linkKey=v;S.linkState=v;markGroup('link',v);
    p01Render({sessionTitle:TITLES[S.titleKey],linkState:S.linkState});
    renderReadout();
    if(++i>=9)stopJit();
  },90);
});
window.addEventListener('resize',()=>p01Render({sessionTitle:TITLES[S.titleKey],linkState:S.linkState}));
renderAll();
</script>
</body>
</html>
