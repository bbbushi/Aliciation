<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alice 消息流 · A 台账 Tape</title>
<style>
/* ============ 曲线与时长：全页唯一定义（PRINCIPLES §2.2/2.3） ============ */
:root{
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --bg:#0f1011; --srf:#151617; --srf2:#1b1c1e;
  --tx:#cac7c0; --dim:#85837c; --faint:#5c5b55;
  --acc:#d29a55; --acc-dim:#8a6438; --ok:#7d9a6f; --bad:#c9705c;
  --hair:#26282a;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc-dim);outline-offset:2px}

.app{height:100dvh;display:flex;flex-direction:column;
  transition:opacity 220ms var(--ease-out),transform 220ms var(--ease-out)}
@starting-style{.app{opacity:0;transform:translateY(6px)}}

/* ============ 08 演示装置（与聊天区并列的信息分区） ============ */
.demo{background:var(--srf);border-bottom:1px solid var(--hair);padding:8px 16px 7px}
.demo-row{display:flex;flex-wrap:wrap;align-items:center;gap:5px}
.demo-cap{font:10px/1 var(--mono);letter-spacing:.16em;color:var(--faint);margin-right:8px}
.dbtn{font:11px/1 var(--mono);letter-spacing:.04em;color:var(--dim);background:none;
  border:1px solid transparent;border-radius:2px;padding:5px 9px;
  transition:color 140ms ease,background-color 140ms ease,border-color 140ms ease,transform 160ms var(--ease-out)}
.dbtn:active{transform:scale(.97)}
.dbtn[aria-current]{color:var(--acc);border-color:var(--acc-dim)}
.dbtn.tgl[aria-pressed="true"]{color:#e8b26b;border-color:var(--acc-dim);background:#1c1812}
.dsep{width:1px;height:14px;background:var(--hair);margin:0 5px}
.demo-note{margin:6px 0 0;font:10px/1.4 var(--mono);color:var(--faint);letter-spacing:.03em}
@media (hover:hover) and (pointer:fine){
  .dbtn:hover{color:#c4c1ba}
  .dbtn[aria-current]:hover{color:#eebd7f}
}

/* ============ 01 会话头栏 ============ */
.head{display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:13px 20px 11px;border-bottom:1px solid var(--hair)}
.head-id{display:flex;align-items:baseline;gap:12px;min-width:0}
.head-name{font-size:15px;font-weight:600;color:#e7e4dd;letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head-sub{font:10.5px/1 var(--mono);color:var(--faint);letter-spacing:.12em;white-space:nowrap}
.head-link{margin:0;font:11px/1 var(--mono);letter-spacing:.05em;color:var(--dim);white-space:nowrap}
.head-link::before{content:'●';font-size:7px;margin-right:7px;vertical-align:1px;color:var(--ok)}
.head[data-link="up"] .head-link[data-on="closing"],
.head[data-link="closing"] .head-link[data-on="up"]{display:none}
.head[data-link="closing"] .head-link{color:var(--bad)}
.head[data-link="closing"] .head-link::before{color:var(--bad)}

/* ============ 02 消息列表容器 ============ */
.list{flex:1;overflow-y:auto;min-height:0;scrollbar-width:thin}
.lwrap{max-width:880px;margin:0 auto;padding:6px 18px 28px}
.loading{margin:52px 4px;font:12px/1 var(--mono);letter-spacing:.1em;color:var(--dim)}
.drow{display:flex;align-items:center;gap:12px;margin:26px 2px 4px;
  color:var(--faint);font:11px/1 var(--mono);letter-spacing:.1em}
.drow::before,.drow::after{content:'';flex:1;height:1px;background:var(--hair)}

/* ============ 03 单条消息（台账行：左声部槽 + 全宽正文） ============ */
.msg{display:grid;grid-template-columns:96px 1fr;gap:2px 18px;
  padding:8px 6px 8px 12px;border-left:2px solid transparent}
.msg.user{border-left-color:var(--acc-dim)}
.msg.grp-start{margin-top:18px;padding-top:14px;border-top:1px solid var(--hair)}
.lwrap .msg.grp-start:first-child{margin-top:4px;padding-top:8px;border-top:0}
.drow + .msg{margin-top:6px;padding-top:8px;border-top:0}
.side{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding-top:2px}
.who{font:10.5px/1 var(--mono);letter-spacing:.14em;color:var(--dim)}
.msg.user .who{color:var(--acc)}
.mt{font:10px/1 var(--mono);color:var(--faint)}
.ch{font:9px/1 var(--mono);color:var(--acc);border:1px solid var(--acc-dim);border-radius:2px;padding:2px 4px}
.stx{font:10px/1.3 var(--mono);color:var(--dim)}
.stx.bad{color:var(--bad)}
.stx.live{color:var(--acc)}
.bd{font-size:14.5px;line-height:1.75;color:var(--tx);
  white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal}
.st{display:none}
.st.on{display:inline}
.silent{color:var(--dim)}
.wait{color:var(--faint)}
.msg.failed,.msg.revealing{cursor:pointer}
.msg.failed:active,.msg.revealing:active{transform:scale(.97)}
.msg.failed,.msg.revealing{transition:transform 160ms var(--ease-out)}
/* 中频入场：assistant 行 160ms 上升；用户行显式选零动画（记录于 DIRECTIONS.md） */
.msg.live.assistant{transition:opacity 160ms var(--ease-out),transform 160ms var(--ease-out)}
@starting-style{.msg.live.assistant{opacity:0;transform:translateY(6px)}}
.msg.instant{transition:none}

/* ============ 06 空状态（罕见档一次性编排，总长 290ms ≤300ms） ============ */
.empty{padding:9vh 8px 20px;max-width:560px}
.empty .ln{opacity:0;transform:translateY(6px)}
.empty .ln{transition:opacity 200ms var(--ease-out),transform 200ms var(--ease-out)}
.empty .ln:nth-child(2){transition-delay:45ms}
.empty .ln:nth-child(3){transition-delay:90ms}
.empty.show .ln{opacity:1;transform:none}
@starting-style{.empty.show .ln{opacity:0;transform:translateY(6px)}}
.e-t{margin:0;font-size:18px;font-weight:600;color:#e2dfd7;letter-spacing:.02em}
.e-d{margin:12px 0 0;font-size:13px;color:var(--dim)}
.e-a{margin:22px 0 0;padding:3px 2px;background:none;border:0;border-bottom:1px solid var(--acc-dim);
  font:13px var(--mono);letter-spacing:.08em;color:var(--acc);width:max-content;
  transition:color 140ms ease,border-color 140ms ease,transform 160ms var(--ease-out)}
.e-a:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){.e-a:hover{color:#eebd7f;border-color:var(--acc)}}
/* 空态退场：同轴反向、更快（130ms） */
.empty.leaving .ln{transition:opacity 130ms var(--ease-out),transform 130ms var(--ease-out);
  transition-delay:0ms;opacity:0;transform:translateY(8px)}

/* ============ 05 composer ============ */
.comp{border-top:1px solid var(--hair);background:var(--srf);padding:9px 18px 11px}
.hint{min-height:16px;margin:0 0 5px 22px;font:11px/1.4 var(--mono);color:var(--acc)}
.hint[data-k="fail"]{color:var(--bad)}
.hint[data-k="close"]{color:var(--bad)}
.hint[data-k=""]{color:var(--dim)}
.hint:empty{visibility:hidden}
.comp-row{display:flex;align-items:flex-end;gap:10px}
.prompt{font:14px/1 var(--mono);color:var(--acc);padding:0 0 12px}
#ta{flex:1;background:transparent;border:0;outline:0;resize:none;color:var(--tx);
  font:14px/1.7 var(--sans);max-height:132px;overflow-y:auto;padding:7px 0 8px}
#ta::placeholder{color:var(--faint)}
#send{font:12px/1 var(--mono);letter-spacing:.24em;color:var(--acc);background:var(--srf2);
  border:1px solid var(--acc-dim);border-radius:3px;padding:10px 14px 10px 17px;
  transition:color 140ms ease,background-color 140ms ease,border-color 140ms ease,transform 160ms var(--ease-out)}
#send:disabled{color:var(--faint);border-color:var(--hair);background:transparent;cursor:default}
#send:not(:disabled):active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){#send:not(:disabled):hover{background:#221d15;border-color:var(--acc)}}
.keys{margin:6px 0 0 22px;font:10px/1 var(--mono);letter-spacing:.05em;color:var(--faint)}

/* ============ 07 回到最新 pill（中频：150ms 入 / 100ms 出，自底部） ============ */
.pill{position:fixed;left:50%;bottom:118px;z-index:20;
  transform:translate(-50%,100%) scale(.96);transform-origin:50% 100%;opacity:0;pointer-events:none;
  font:12px/1 var(--mono);letter-spacing:.06em;color:var(--tx);
  background:rgba(21,22,23,.95);border:1px solid var(--hair);border-radius:3px;padding:9px 14px;
  transition:opacity 150ms var(--ease-out),transform 150ms var(--ease-out),
    color 140ms ease,border-color 140ms ease}
.pill[data-show]{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
.pill:not([data-show]){transition-duration:100ms}
.pill:active{transform:translate(-50%,0) scale(.97)}
.pill b{color:var(--acc);font-weight:500;margin-left:7px}
@media (hover:hover) and (pointer:fine){.pill[data-show]:hover{border-color:var(--acc-dim);color:#fff}}

/* ============ reduced-motion：更少更温和（留透明度，删位移与 stagger） ============ */
@media (prefers-reduced-motion:reduce){
  .app{transition:none;transform:none}
  .msg.live.assistant{transition:opacity 160ms var(--ease-out);transform:none}
  .msg.failed,.msg.revealing{transition:transform 160ms var(--ease-out)}
  .empty .ln{transition:opacity 160ms var(--ease-out);transition-delay:0ms;transform:none}
  .empty.leaving .ln{transition:opacity 120ms var(--ease-out);transform:none}
  .pill{transition:opacity 120ms var(--ease-out),color 140ms ease,border-color 140ms ease;transform:translate(-50%,0)}
}
</style>
</head>
<body>
<div class="app">

  <section class="demo" aria-label="演示装置">
    <div class="demo-row">
      <span class="demo-cap">演示数据</span>
      <button class="dbtn" data-ds="normal">日常对话</button>
      <button class="dbtn" data-ds="worst">最坏数据</button>
      <button class="dbtn" data-ds="empty">空会话</button>
      <span class="dsep" aria-hidden="true"></span>
      <button class="dbtn" id="replayBtn">重播当前档位</button>
      <button class="dbtn" id="clearBtn">清空会话</button>
      <span class="dsep" aria-hidden="true"></span>
      <button class="dbtn tgl" id="failTgl" aria-pressed="false">模拟发送失败</button>
      <button class="dbtn tgl" id="closeTgl" aria-pressed="false">模拟服务关闭</button>
    </div>
    <p class="demo-note">本页为离线演示，所有消息与状态均为虚构数据。</p>
  </section>

  <header class="head" id="head" data-link="up">
    <div class="head-id">
      <span class="head-name">Alice</span>
      <span class="head-sub">单一会话 · 记忆持续</span>
    </div>
    <p class="head-link" data-on="up">本机已连接</p>
    <p class="head-link" data-on="closing">服务正在关闭</p>
  </header>

  <main class="list" id="list" aria-label="消息列表"></main>

  <section class="comp" aria-label="输入区">
    <p class="hint" id="hint" role="status"></p>
    <div class="comp-row">
      <span class="prompt" aria-hidden="true">»</span>
      <textarea id="ta" rows="1" placeholder="给 Alice 写点什么…" aria-label="写给 Alice 的消息"></textarea>
      <button id="send" disabled>发送</button>
    </div>
    <p class="keys">Enter 发送 · Shift+Enter 换行</p>
  </section>

</div>

<button class="pill" id="pill" aria-label="回到最新" aria-hidden="true" tabindex="-1">↓ 回到最新<b id="pillN"></b></button>

<script>
'use strict';
/* ===== 变体参数：逐句节奏为内容节拍（产品既有 170–520ms/句 带宽内），非动画时长 ===== */
const CAD={min:190,max:260};
const THINK={min:500,max:900};

/* ===== 状态总线（PARTS §2.2 单一真源） ===== */
const S={turns:[],link:'up',busy:false,listState:'loading',atLatest:true,unread:0,
  dataset:'normal',userName:'阿澈',gen:0,failOnce:false,failHint:false,lock:false,uid:0};
const $=id=>document.getElementById(id);
const list=$('list'),ta=$('ta'),sendBtn=$('send'),hint=$('hint'),
  pill=$('pill'),pillN=$('pillN'),head=$('head'),
  failTgl=$('failTgl'),closeTgl=$('closeTgl'),replayBtn=$('replayBtn'),clearBtn=$('clearBtn');
let wrap=null;

const rnd=r=>r.min+Math.random()*(r.max-r.min);
const uid=()=>'t'+(++S.uid)+'-'+Date.now().toString(36);
const el=(t,c,txt)=>{const n=document.createElement(t);if(c)n.className=c;if(txt!=null)n.textContent=txt;return n;};

/* ===== 切句（03 切句规则：句末标点断、括号内不断、换行强制、尾部自成单元、400 上限） ===== */
const PAIRS={'（':'）','「':'」','『':'』','【':'】','(':')','[':']'};
const END='。！？…';
function splitSentences(text){
  if(!text||!text.trim())return[];
  const out=[];let cur='',depth=0;
  for(const ch of text){
    cur+=ch;
    if(ch==='\n'){out.push(cur);cur='';depth=0;continue;}
    if(PAIRS[ch]){depth++;continue;}
    if('）」』】)]'.includes(ch)){if(depth>0)depth--;continue;}
    if(END.includes(ch)&&depth===0){out.push(cur);cur='';}
  }
  if(cur)out.push(cur);
  if(out.length>400){const head=out.slice(0,399);head.push(out.slice(399).join(''));return head;}
  return out;
}
const countSent=t=>(t.text&&t.text.trim())?splitSentences(t.text).length:0;

/* ===== 时间格式（03/02 文案表） ===== */
const p2=n=>String(n).padStart(2,'0');
const hm=ms=>{const d=new Date(ms);return p2(d.getHours())+':'+p2(d.getMinutes());};
const dayKey=ms=>{const d=new Date(ms);return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();};
const dayLabel=ms=>{const d=new Date(ms),n=new Date();
  return (d.getFullYear()!==n.getFullYear()?d.getFullYear()+'年':'')+(d.getMonth()+1)+'月'+d.getDate()+'日';};

/* ===== 08 数据集 ===== */
const T=(day,h,m)=>new Date(2026,10,day,h,m).getTime();
const LONG=(()=>{const b='编译在凌晨完成，没有警告。起服日志滚过三百行，端口监听正常，内存停在四十一兆。归档线程按计划写完了三份索引。';
  let s='';while(s.length<1880)s+=b;return s+'以上，长文到此收尾。';})();
const URLISH='https://mirror.internal.alice/pkg/'+'a'.repeat(170);
const EMOJI='👨‍👩‍👧‍👦 都到齐了。🌊 潮水退了，滩上很静。✨ 晚安。';
const REPLY='收到，我看到了你写的内容。接下来这几句演示逐句揭示的节奏，一句一句落到页面上。【认真】顶部的演示装置里有发送失败与服务关闭的开关，可以随时拨动。揭示中点这条消息可以直接跳过。点「回到最新」也会一次补全。';

const DATA={
  normal:()=>[
    {id:'n1',role:'user',text:'今天的部署顺利吗？',time:T(15,23,47)},
    {id:'n2',role:'assistant',text:'顺利。编译和起服都一次过，共存检查没有报错。【安心】部署记录已经归档，明天可以晚点起。',time:T(15,23,49)},
    {id:'n3',role:'assistant',channel:'qq',text:'早上好。昨夜监控没有异常，桌面 0.1.5 的自动检查十点半会跑第一次。',time:T(16,9,3)},
    {id:'n4',role:'user',text:'好，那今天陪我把升级流程再过一遍？',time:T(16,9,12)},
    {id:'n5',role:'assistant',reveal:true,text:'可以。上午我陪你过一遍自动检查的流程，先确认更新开关的状态，再走一次同版提示的路径。【认真】有问题随时说，我会记下每一步的卡点。过完这轮，把要点整理进桌面档案。',time:T(16,9,13)}
  ],
  worst:()=>[
    {id:'w1',role:'user',text:URLISH,time:T(16,10,2)},
    {id:'w2',role:'assistant',text:LONG,time:T(16,10,3)},
    {id:'w3',role:'assistant',text:EMOJI,time:T(16,10,5)},
    {id:'w4',role:'user',text:'在吗',time:T(16,10,6)},
    {id:'w5',role:'assistant',text:'嗯',time:T(16,10,7)},
    {id:'w6',role:'assistant',text:'',time:T(16,10,8)},
    {id:'w7',role:'user',text:'这条会发送失败',status:'failed',time:T(16,10,9)},
    {id:'w8',role:'assistant',text:'这一轮没有时间字段，元信息按字段隐藏。',time:null}
  ]
};

/* ===== 03 单条消息：台账行构建 ===== */
function buildTurn(t,o){
  const art=el('article','msg '+t.role+(o.instant?' instant':' live')+(o.cont?' cont':' grp-start'));
  art.dataset.role=t.role;art.dataset.id=t.id;
  if(t.status==='failed'){art.classList.add('failed');art.tabIndex=0;art.title='点击重试';}
  if(t.reveal||t.state==='revealing'){t.state='revealing';art.classList.add('revealing');art.title='点击可跳过逐句显示';}
  const side=el('div','side');
  side.append(el('span','who',t.role==='user'?S.userName:'ALICE'));
  if(t.time!=null)side.append(el('span','mt',hm(t.time)));
  if(t.channel==='qq')side.append(el('span','ch','QQ'));
  if(t.status==='sending')side.append(el('span','stx send','发送中'));
  if(t.status==='failed')side.append(el('span','stx bad','发送失败 · 点击重试'));
  if(t.state==='revealing')side.append(el('span','stx live','正在回复…'));
  const bd=el('div','bd');
  fillBody(bd,t);
  art.append(side,bd);
  return art;
}
function fillBody(bd,t){
  bd.textContent='';
  if(!t.text||!t.text.trim()){bd.append(el('span','silent','（沉默）'));return;}
  const parts=splitSentences(t.text);
  if(t.role==='assistant'&&t.state==='revealing'){
    bd.append(el('span','wait','…'));
    parts.forEach(s=>{bd.append(el('span','st',s));});
  }else{
    parts.forEach(s=>{bd.append(el('span','st on',s));});
  }
}
function statusHost(art){return art.querySelector('.side')||art.querySelector('.meta');}
function setStatus(art,cls,txt){
  let n=art.querySelector('.stx.'+cls);
  if(!n){n=el('span','stx '+cls,txt);statusHost(art).append(n);}else n.textContent=txt;
}
function clearStatus(art,cls){const n=art.querySelector('.stx.'+cls);if(n)n.remove();}

/* ===== 02 列表装配（日期行 / 同侧分组 / 追加） ===== */
function buildDateRow(ms){const d=el('div','drow');d.append(el('span','',dayLabel(ms)));d.setAttribute('role','separator');return d;}
function renderAll(){
  S.turns.forEach((t,i)=>{
    const prev=S.turns[i-1];
    if(prev&&prev.time!=null&&t.time!=null&&dayKey(prev.time)!==dayKey(t.time))wrap.append(buildDateRow(t.time));
    const cont=!!prev&&prev.role===t.role&&!(prev.time!=null&&t.time!=null&&dayKey(prev.time)!==dayKey(t.time));
    wrap.append(buildTurn(t,{instant:true,cont}));
  });
}
function append(t,live){
  const prev=S.turns[S.turns.length-1];
  S.turns.push(t);
  if(prev&&prev.time!=null&&t.time!=null&&dayKey(prev.time)!==dayKey(t.time))wrap.append(buildDateRow(t.time));
  const cont=!!prev&&prev.role===t.role&&!(prev.time!=null&&t.time!=null&&dayKey(prev.time)!==dayKey(t.time));
  wrap.append(buildTurn(t,{instant:!live,cont}));
  if(S.listState!=='ready')S.listState='ready';
  if(!S.atLatest){S.unread+=countSent(t);}
  else list.scrollTop=list.scrollHeight;
  updatePill();
}

/* ===== 02 状态面（loading / empty / ready） ===== */
function renderFace(){
  wrap=el('div','lwrap');
  if(S.listState==='loading'){
    wrap.append(el('p','loading','正在载入对话…'));
  }else if(S.listState==='empty'){
    const e=el('div','empty show');
    e.append(el('h2','ln e-t',(S.userName?S.userName+'，':'')+'这里还很安静'));
    e.append(el('p','ln e-d','说第一句话，Alice 会一句一句地回你。'));
    const a=el('button','ln e-a','写下第一句');
    a.addEventListener('click',()=>ta.focus());
    e.append(a);
    wrap.append(e);
  }else{
    renderAll();
  }
  list.replaceChildren(wrap);
  updatePill();
}

/* ===== 04 逐句揭示（四不变量：按序 / 完整 / 可跳过 / 可对齐） ===== */
function startReveal(t){
  const g=S.gen,art=wrap.querySelector('[data-id="'+t.id+'"]');
  if(!art)return;
  const spans=[...art.querySelectorAll('.st')],wait=art.querySelector('.wait');
  let i=0,done=false;
  const finish=()=>{ /* 补全前缀到达完整，绝不整段倒出 */
    if(done||t.state!=='revealing')return;
    done=true;t.state='done';
    spans.forEach(s=>s.classList.add('on'));
    if(wait)wait.remove();
    clearStatus(art,'live');
    art.classList.remove('revealing');art.removeAttribute('title');
    S.busy=false;renderHint();updateSend();
  };
  t._finish=finish;
  const step=()=>{
    if(g!==S.gen||done||t.state!=='revealing')return;
    if(wait)wait.remove();
    if(i<spans.length){
      spans[i++].classList.add('on');
      if(!S.atLatest){S.unread++;updatePill();}
      else list.scrollTop=list.scrollHeight;
      setTimeout(step,rnd(CAD));
    }else finish();
  };
  setTimeout(step,rnd(THINK));
}

/* ===== 07 pill 与 02 滚动语义（滞回） ===== */
function updatePill(){
  const show=!S.atLatest&&S.turns.length>0&&S.listState==='ready';
  if(show){
    pill.setAttribute('data-show','');
    pill.setAttribute('aria-hidden','false');
    pill.tabIndex=0;
    pillN.textContent=S.unread>0?'＋'+(S.unread>99?'99+':S.unread)+' 句':'';
  }else{
    pill.removeAttribute('data-show');
    pill.setAttribute('aria-hidden','true');
    pill.tabIndex=-1;
    pillN.textContent='';
  }
}
function setFollow(v){
  if(S.atLatest===v)return;
  S.atLatest=v;
  if(v)S.unread=0;
  updatePill();
}
list.addEventListener('scroll',()=>{
  const max=list.scrollHeight-list.clientHeight;
  if(max<=0){setFollow(true);return;}
  const d=max-list.scrollTop;
  if(S.atLatest&&d>140)setFollow(false);
  else if(!S.atLatest&&d<=48)setFollow(true);
});
pill.addEventListener('click',()=>{ /* 用户主动回底 = 单次受控（本变体取瞬时跳转）+ 触发跳过 */
  list.scrollTop=list.scrollHeight;
  setFollow(true);
  S.turns.forEach(t=>{if(t.state==='revealing'&&t._finish)t._finish();});
});

/* ===== 05 composer（草稿终身保管；Enter 发送 / Shift+Enter 换行；回执前不得二次发出） ===== */
function updateSend(){sendBtn.disabled=!(ta.value.trim()&&!S.busy&&S.link==='up'&&!S.lock&&S.listState!=='loading');}
function renderHint(){
  let k='',txt='';
  if(S.failHint){k='fail';txt='发送失败，草稿已恢复';}
  else if(S.link==='closing'){k='close';txt='服务正在关闭，暂停接收新消息';}
  else if(S.busy){k='busy';txt='Alice 正在处理消息；输入会保留';}
  hint.textContent=txt;hint.dataset.k=k;
}
ta.addEventListener('input',()=>{
  ta.style.height='auto';
  ta.style.height=Math.min(ta.scrollHeight,132)+'px';
  if(S.failHint){S.failHint=false;renderHint();}
  updateSend();
});
ta.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){
    e.preventDefault();
    submit();
  }
});
sendBtn.addEventListener('click',submit);
function submit(){
  if(S.lock)return;
  const v=ta.value.trim();
  if(!v||S.busy||S.link!=='up'||S.listState==='loading')return;
  if(S.failOnce){ /* 08 error 剧本：用户轮置 failed + 回填草稿 */
    S.failOnce=false;setTgl(failTgl,false);
    S.failHint=true;
    const t={id:uid(),role:'user',text:v,status:'failed',time:Date.now()};
    afterEmptyExit(()=>{append(t,true);renderHint();});
    ta.value=v;ta.style.height='auto';updateSend(); /* 05：失败回执逐字回填草稿 */
    return;
  }
  S.busy=true;S.lock=true;renderHint();updateSend();
  const t={id:uid(),role:'user',text:v,status:'sending',time:Date.now()};
  const g=S.gen;
  afterEmptyExit(()=>{
    append(t,true);
    ta.value='';ta.style.height='auto';updateSend();
    setTimeout(()=>{
      if(g!==S.gen){S.lock=false;return;}
      t.status='ok';
      clearStatus(wrap.querySelector('[data-id="'+t.id+'"]'),'send');
      const a={id:uid(),role:'assistant',text:REPLY,time:Date.now(),state:'revealing'};
      append(a,true);
      startReveal(a);
      S.lock=false;updateSend();
    },420);
  });
}
function afterEmptyExit(cb){ /* 06：空态先退场（130ms，快于入场），再上屏，绝不同屏 */
  const emp=list.querySelector('.empty');
  if(!emp){cb();return;}
  const g=S.gen;
  emp.classList.add('leaving');
  setTimeout(()=>{if(g!==S.gen)return;emp.remove();cb();},150);
}

/* ===== 03 失败重试（点击 / Enter） ===== */
function retry(t){
  if(t.status!=='failed')return;
  t.status='sending';
  const art=wrap.querySelector('[data-id="'+t.id+'"]');
  clearStatus(art,'bad');
  art.classList.remove('failed');art.removeAttribute('title');art.tabIndex=-1;
  setStatus(art,'send','发送中');
  const g=S.gen;
  setTimeout(()=>{
    if(g!==S.gen)return;
    t.status='ok';clearStatus(art,'send');
    S.busy=true;renderHint();updateSend();
    const a={id:uid(),role:'assistant',text:REPLY,time:Date.now(),state:'revealing'};
    append(a,true);startReveal(a);
  },520);
}
list.addEventListener('click',e=>{
  const art=e.target.closest('.msg');if(!art)return;
  const t=S.turns.find(x=>x.id===art.dataset.id);if(!t)return;
  if(t.state==='revealing'&&t._finish){t._finish();return;}
  if(t.status==='failed')retry(t);
});
list.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const art=e.target.closest&&e.target.closest('.msg');if(!art)return;
  const t=S.turns.find(x=>x.id===art.dataset.id);
  if(t&&t.status==='failed')retry(t);
});

/* ===== 08 演示装置接线 ===== */
const dsBtns=[...document.querySelectorAll('.dbtn[data-ds]')];
function markCur(){dsBtns.forEach(b=>b.dataset.ds===S.dataset?b.setAttribute('aria-current','true'):b.removeAttribute('aria-current'));}
function setDataset(name){ /* 切档：停旧剧本（gen++）→ loading 整面替换 → 注入 */
  S.gen++;S.dataset=name;markCur();
  S.busy=false;S.failHint=false;S.lock=false;
  S.turns=[];S.listState='loading';S.atLatest=true;S.unread=0;
  renderFace();renderHint();updateSend();
  const g=S.gen;
  setTimeout(()=>{
    if(g!==S.gen)return;
    if(name==='empty'){S.listState='empty';renderFace();updateSend();return;}
    S.turns=DATA[name]();S.listState='ready';renderFace();updateSend();
    if(S.atLatest)list.scrollTop=list.scrollHeight;
    const live=S.turns.find(t=>t.reveal);
    if(live){S.busy=true;renderHint();updateSend();startReveal(live);}
  },420);
}
dsBtns.forEach(b=>b.addEventListener('click',()=>setDataset(b.dataset.ds)));
replayBtn.addEventListener('click',()=>setDataset(S.dataset));
clearBtn.addEventListener('click',()=>setDataset('empty')); /* 不清草稿：草稿属于用户 */
function setTgl(btn,on){on?btn.setAttribute('aria-pressed','true'):btn.setAttribute('aria-pressed','false');}
failTgl.addEventListener('click',()=>{S.failOnce=!S.failOnce;setTgl(failTgl,S.failOnce);});
closeTgl.addEventListener('click',()=>{
  const closing=S.link==='up';
  S.link=closing?'closing':'up';
  head.dataset.link=S.link;
  setTgl(closeTgl,closing);
  renderHint();updateSend();
});

/* ===== 启动 ===== */
markCur();
setDataset('normal');
</script>
