<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alice</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- 初始化：第一次打开（还没有任何对话）时出现 -->
<div id="welcome" class="screen hidden">
  <div class="welcome-card">
    <div class="w-head">
      <h1>和 <span id="seed-name">Alice</span> 开始</h1>
      <p id="w-sub">这是你们的第一个会话。</p>
    </div>

    <div id="current-persona" class="cur hidden">
      <div class="cur-text">
        <div class="cur-title">她已经有一个先装好的人格</div>
        <div class="cur-meta" id="cur-meta"></div>
      </div>
      <div class="cur-actions">
        <button id="cur-view" class="btn ghost">看看</button>
        <button id="cur-start" class="btn primary">以她开始</button>
      </div>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab on" data-tab="tags" role="tab">选气质标签</button>
      <button class="tab" data-tab="import" role="tab">导入人格文档</button>
    </div>

    <section id="tab-tags" class="tab-pane">
      <p class="hint">选 2~4 个气质标签当底色。剩下的性格，由你们的经历慢慢长。</p>
      <div id="tag-list" class="tags"></div>
      <button id="seed-go" class="btn primary wide" disabled>生成底色并开始</button>
    </section>

    <section id="tab-import" class="tab-pane hidden">
      <div id="drop" class="drop">
        <div class="drop-icon">↓</div>
        <div class="drop-main">把人格文档拖到这里，或 <button id="pick-file" class="link" type="button">选择文件</button></div>
        <div class="hint">.md / .markdown / .txt；也可以直接粘贴到下面</div>
        <input type="file" id="import-file" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden>
      </div>
      <textarea id="import-md" rows="8" spellcheck="false" placeholder="# Alice 的人格&#10;&#10;## 底色 · 气质与风格&#10;&#10;- 说话轻声，短句&#10;- 不急着给建议&#10;- 不确定时就说不知道"></textarea>
      <div id="import-check" class="check"></div>
      <div class="row">
        <button id="import-preview" class="btn ghost" disabled>预览</button>
        <button id="import-go" class="btn primary" disabled>安装并开始</button>
      </div>
    </section>
  </div>
</div>

<div id="app" class="hidden">
  <div id="chat" class="chat">
    <header>
      <div class="who" id="name">Alice</div>
      <div class="head-right">
        <div class="mem" id="memory" title="三层记忆 / 已遗忘 / 技能"></div>
        <button id="persona-btn" class="btn ghost" title="看人格、换人格">人格</button>
        <button id="panel-btn" class="btn ghost" title="监测仪">监测</button>
      </div>
    </header>
    <main id="msgs"></main>
    <footer>
      <input id="input" type="text" placeholder="说点什么…" autocomplete="off" autofocus>
      <button id="send" class="btn primary">发送</button>
    </footer>
  </div>

  <aside id="panel" class="hidden">
    <div class="panel-sec">
      <div class="panel-title">思考深度</div>
      <select id="thinking">
        <option value="on">开（默认）</option>
        <option value="off">关（更省 token）</option>
      </select>
      <div class="panel-hint">关：跳过思考过程，回复更快、输入 token 大幅下降；随时可切回。</div>
    </div>

    <div class="panel-sec">
      <div class="panel-title">监测仪</div>
      <div id="cards"></div>
      <div class="panel-title small">添加指标</div>
      <div id="pool" class="chips"></div>
      <div class="panel-hint">评审型指标每轮对话后用廉价模型评审一次。</div>
    </div>
  </aside>
</div>

<!-- 人格弹层：查看当前人格 / 替换 -->
<div id="modal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">
      <div class="modal-title" id="modal-title">当前人格</div>
      <button id="modal-x" class="card-x" title="关闭">×</button>
    </div>
    <div class="modal-meta" id="modal-meta"></div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot" id="modal-foot"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="/app.js"></script>
</body>
</html>
