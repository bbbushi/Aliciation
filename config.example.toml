# 复制为 user/config.toml 后填写（user/ 整目录已被 gitignore）。任何 OpenAI 兼容平台均可用。
[llm]
base_url = "https://open.bigmodel.cn/api/paas/v4"   # 例：智谱；DeepSeek 用 https://api.deepseek.com
chat_model  = "glm-4.6"        # 对话模型
cheap_model = "glm-4.5-flash"  # 记忆提取/技能提炼/人格演化用廉价模型
api_key = ""                   # 直接填在这里（user/ 不入 git，不会入库）
# 也可以改走环境变量：删掉上一行，export ALICE_API_KEY=...（api_key_env 可改变量名）

[persona]
# 近位锚整条选材并计入总预算；效果须独立人工对照，默认保持关闭。
expression_anchor = false  # P1b 近位表达提醒（默认关；人工对照开关）
expression_mode = "full"   # 人格投影：full=完整用途投影；registry=核心常驻+场景按需（需已准备驻留分层，合同无效自动回退 full）
name = "Alice"       # AI 的名字
# 数据触发：每累计 N 条新记忆演化一次人格。安静则不变（没有时间兜底）
evolve_every_memories = 15

[context]
reply_sections_enabled = true # 前台三栏回复与追问缓存，关闭后重启可回退
reply_annotation_review = false # 实验性前台复读标注，每条可审阅回复增加一次调用
transform_review_enabled = true # 显式带引文改写/翻译：增加一次有界审查，失败保留原句，不流出未审草稿
assembly_mode = "legacy"      # C1人工试用设indexed；不自动重装人格或迁移记忆
total_budget_tokens = 100000   # 长度启发式估算；含工具/资料，非精确token上界；0关闭守卫
reply_reserve_tokens = 4000
memory_candidate_limit = 12
memory_catalogue_chars = 3600  # 本轮累计目录预算；初始最多1800，搜索也计入
memory_expanded_chars = 8000   # 完整条目与回执预算；超限拒读，不截限定条件
memory_tool_calls = 2         # 仍受本轮总工具上限约束（含来源回忆）
working_set_enabled = false   # C2 独立试用开关；还需 assembly_mode="indexed"
working_set_max_items = 4
working_set_max_chars = 4000   # 完整标题/正文的JSON容量，额外计入C1展开与总上下文预算
working_set_ttl_turns = 12     # 当前渠道后续装配次数；重复keep不续期
working_set_calls = 4          # keep/release合计，仍受本轮总工具上限约束
history_enabled = false       # C3独立开关，需indexed；只读当前库同渠道的已完成普通往返
history_max_chars = 8000      # 目录及完整原文回执累计预算；不截断后伪称完整
history_calls = 2             # search与load各自的次数上限；0同时关闭，字数与本轮总工具预算共用
# 前情与实际完整往返装配共用边界，提前预留注入上限；按既有最小跨度分批生成。
recap_enabled = false         # C3普通旧往返前情；默认关闭，独立于indexed
recap_min_rows = 4
recap_span_max_rows = 60
recap_max_chars = 600
recap_inject_count = 2
recap_inject_chars = 1200
observer_enabled = true        # 上下文观测 SDK：装配与调用的元数据事件（只读查询面用）
observer_body_capture = false  # 正文快照（本机调试用；写入 user/data/observation，10请求/7天/50MiB 有限额度）
recent_turns = 16              # 最近消息条数上限，按完整往返选择；不是16次用户发送
active_days = 2                # 活跃层/仓库层分界（天）
survival_days = 7              # 生存过滤线（天）
survival_min_uses = 1          # 跨过生存线存活所需的最少(提及+使用)次数
warehouse_index_max_lines = 120
active_full = 20               # 近期记忆全量注入的条数，其余只列标题
longterm_top_k = 12            # 每轮注入的长期记忆条数
longterm_capacity = 2000       # 长期层容量上限

[memory]
extract_every_turns = 10       # 每累计多少用户轮跑一次记忆提取
distill_every_memories = 30    # 数据触发：每累计 N 条新记忆提炼一次技能
deliberate_every_memories = 15
observation_value_review = true # 已分级新见闻：七天复核，高价值优先保留；来源期限不延长
deliberate_early_high = true   # 高价值/冲突/重复材料提前；用户当轮讨论可立即提取
interest_decay_days = 90       # 未获用户新表达支持时，置信度衰减
observation_high_chars = 1200  # 见闻内容建议字数；保留必要条件，不机械截断
observation_normal_chars = 600
observation_low_chars = 180
observation_condense_max_ratio = 0.8 # 至少缩减20%；无法保留关键条件时不强行改写

# QQ 仅本人私聊；初始关闭。配置变更须排空并重启 Alice 后生效。
# 令牌不同于 QQ AppSecret 和模型 API Key，核心仅保存其 SHA-256。
[channels]
enabled = false
protocol_version = 1

[channels.qq_owner]
enabled = false
token_sha256 = ""
provider = "qq-official"
app_id = ""
sender_id = ""
chat_type = "c2c"

# 上下文观测插件（固定同源独立页；采集开关独立在 [context] observer_*）
[plugins]
context_inspector_enabled = false  # 显式启用后提供 /addons/context-inspector/ 页面与聊天回复旁入口

# 人格注册表（expression_mode="registry" 时生效；准备时冻结分类额度，运行配置只能收紧）
[expression]
max_core_chars = 2200           # 核心常驻正文上限
max_registry_chars = 1600       # 场景目录序列化上限
max_registry_bundles = 12       # 目录场景包数量上限
max_scene_expanded_chars = 2400 # 单场景完整闭包 / 本轮按需正文总量上限
max_persona_load_calls = 2      # persona_load 每轮调用次数
max_persona_loaded_bundles = 2  # 本轮最多读取的场景包数
