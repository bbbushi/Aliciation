[package]
name = "alice-desktop"
version = "0.1.18"
edition = "2021"
default-run = "alice-desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-updater = { version = "=2.14.1", default-features = false, features = ["native-tls", "system-proxy"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "stream"] }
tar = "0.4"
flate2 = "1"
sha2 = "0.11"
semver = "1"
minisign = { version = "0.9", optional = true }
base64 = "0.23"
minisign-verify = "0.3"

[features]
custom-protocol = ["tauri/custom-protocol"]
release-tools = ["dep:minisign"]

[[bin]]
name = "alice-update-signer"
path = "src/bin/update-signer.rs"
required-features = ["release-tools"]
