<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>桌面气泡</title><link rel="stylesheet" href="bubble.css"><script src="bubble-ui.js" defer></script></head><body class="settings-page"><main>
<span class="label">ALICE · 桌面</span><h1>在手边，继续聊</h1>
<p>点击悬浮图标，再点旁边的对话图标即可输入。Alice 会一句一句回复；被动消息预览穿透鼠标，不抢走键盘。</p>
<form id="preferences"><label><input id="enabled" type="checkbox"> 启用桌面气泡</label><p class="hint">启用后，关闭主窗口会隐藏到后台。通过设置的退出图标、菜单或 ⌘Q 退出整个 Alice。</p>
<label><input id="show-body" type="checkbox"> 在桌面预览回复正文</label><p class="hint">关闭后只显示未读标记。演示或共享屏幕前可在菜单栏暂停气泡。</p>
<label><input id="solid" type="checkbox"> 使用实色背景，提高对比度</label><p class="hint">默认聊天框背景透明，只保留消息和输入区域的淡底色。开启实色背景可恢复整块底色。</p>
<div class="actions"><button id="save" type="submit">保存设置</button><button id="reset" type="button">找回气泡位置</button></div>
<p id="status" role="status" aria-live="polite">正在读取设置…</p></form>
</main></body></html>
